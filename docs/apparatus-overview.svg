<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-labelledby="title description">
<title id="title">Five Tempo control architectures</title>
<desc id="description">A schematic overview of the touch terminal, clock regulator, laboratory console, open engine and magical astrolabe. This is an illustration of the control layouts, not a browser screenshot.</desc>
